<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFK League — Fixtures & Table</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .view-toggle{ display:flex; gap:8px; margin:20px 0 16px; }
  .view-toggle button{
    flex:1; padding:9px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-card); color:var(--text-dim); font-weight:600; font-size:13px;
  }
  .view-toggle button.active{ background:var(--gold); color:#1a1400; border-color:var(--gold); }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h1>AFK League</h1>
    <p>Up to 20 players · full round robin · scores updated by admins.</p>
  </div>

  <div class="view-toggle">
    <button data-view="fixtures" class="active">Fixtures</button>
    <button data-view="table">Table</button>
  </div>

  <div id="view-fixtures">
    <div id="fixtures"></div>
  </div>

  <div id="view-table" style="display:none">
    <table class="standings">
      <thead>
        <tr>
          <th></th>
          <th>Player</th>
          <th class="num">P</th>
          <th class="num">W</th>
          <th class="num">D</th>
          <th class="num">L</th>
          <th class="num">GD</th>
          <th class="num">Pts</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/league.js"></script>
</body>
</html>
